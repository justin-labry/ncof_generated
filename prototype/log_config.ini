[loggers]
keys=root,hypercorn_access,hypercorn_error,nncof

[handlers]
keys=console,file

[formatters]
keys=colored,standard


[logger_root]
level=INFO
handlers=console,file


[logger_hypercorn_access]
level=INFO
handlers=console,file
qualname=hypercorn.access
propagate=0


[logger_hypercorn_error]
level=INFO
handlers=console,file
qualname=hypercorn.error
propagate=0


[logger_nncof]
level=INFO
handlers=console,file
qualname=nncof
propagate=0


[handler_console]
class=StreamHandler
level=INFO
formatter=colored
args=(sys.stderr,)


[handler_file]
class=handlers.TimedRotatingFileHandler
level=INFO
formatter=standard
args=('./logs/app.log', 'midnight', 1, 30, 'utf-8')
kwargs={'delay': True}


[formatter_colored]
class=colorlog.ColoredFormatter
format=%(log_color)s[%(asctime)s] [%(levelname)s] [%(name)s] - %(message)s [%(filename)s:%(lineno)d]
; datefmt=%H:%M:%S
log_colors=
  DEBUG=cyan
  INFO=green
  WARNING=yellow
  ERROR=red
  CRITICAL=bold_red


[formatter_standard]
class=logging.Formatter
; format=[%(asctime)s] [%(levelname)s] [%(name)s] - %(message)s [%(filename)s:%(lineno)d]
format=[%(asctime)s] [%(levelname)s] - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
