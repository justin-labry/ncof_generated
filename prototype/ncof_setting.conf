# ==============================================================================
# NCOF Mock-up 설정 단일 출처 (Single Source of Truth)
# ------------------------------------------------------------------------------
# 이 파일 하나만 수정하고 서버를 재시작하면 포트·프로토콜이 반영됩니다.
#   - 각 NF의 run.sh / run_http2.sh 가 이 파일을 읽어 listen 포트·TLS 설정에 사용
#   - NCOF(nrf.py)·클라이언트(client2.py)가 이 파일을 읽어 대상 주소를 구성
#   - GUI(vite.config.ts)가 NCOF_PORT / NCOF_TLS 를 읽어 dev 프록시를 구성
# 이 파일은 git 으로 추적됩니다(.env 과 달리 clone 시 함께 공유됨).
# 우선순위: CLI 환경변수 > 이 파일 > 코드 기본값. (예: NCOF_TLS=1 sh run_http2.sh)
# ==============================================================================

# --- NF 호스트/포트 ---
NF_HOST=127.0.0.1
NCOF_PORT=9000
SMF_PORT=9001
NEF_PORT=9002
UPF_PORT=9003
PCF_PORT=9004

# --- HTTP/2 전송 모드 ---
# 0(또는 off)=h2c(평문 HTTP/2, 기본) · 1(또는 true/yes/on)=HTTP/2 over TLS(self-signed cert.pem/key.pem)
NCOF_TLS=0

# --- gNB2 판정 (룰 엔진) ---
# NCOF 가 판정 틱마다 이 파일의 수정 시각을 보고, 바뀌었으면 아래 값을 다시 읽는다 — 재기동 없이 바로 반영된다.
# (포트와 달리 이 파일만 본다 — 키를 지우거나 비우면 기본값. 판정 입력은 12p_c = WLAN_PERFORMANCE 하위 구독의 DL 평균 처리량,
#  12p_c 가 repPeriod×3 넘게 끊기면 판정을 보류한다. 이 파일은 UTF-8 로 저장할 것)
# 12p_c WLAN DL 이 이 값 이상이면 ACTIVE, 미만이면 DEEP_SLEEP (Mbps)
GNB2_TH_MBPS=300
# 히스테리시스 폭(Mbps). ACTIVE 에서 DEEP_SLEEP 으로는 TH-폭 미만일 때만 내려간다(0 = 끔).
# 12p_c 는 주기마다 수 Mbps 씩 흔들린다(9/30 실측 282~292) — TH 를 그 대역에 두면 폭을 줄 것.
GNB2_HYST_MBPS=0
# 상태가 바뀐 뒤 최소 유지 시간(초, 0 = 끔)
GNB2_MIN_DWELL_SEC=0
# 판정 방식: threshold = 위 임계 규칙만 · trend = TH 이상일 때 같은 12p_c 스트림을 지난 판정 때 본 값보다 오르면 ACTIVE,
# 내리면 DEEP_SLEEP. TH 미만은 DEEP_SLEEP. 다음은 TH 이상 = ACTIVE(임계 규칙 그대로): 첫 판정, 지난 판정 값이 없거나
# 상향 repPeriod×3 넘게 떨어져 있을 때(끊긴 뒤), 지난 판정 값이 TH 미만이었을 때(아래에서 올라옴).
# ("직전 10초 샘플" 이 아니라 "지난 판정 값" 과 비교한다 — 판정 틱 사이에 쌓인 변화를 놓치지 않으려고)
# level = 아래 GNB2_LEVEL_* 단계 판정(셀 상태와 gNB2:WLAN 비율을 함께 정한다). trend 로 되돌리면 재기동 없이 원복된다
GNB2_DECISION_MODE=level
# trend 의 '변화 없음' 폭(Mbps). |현재-지난 판정 값| 이 이 값 이하면 현재 상태를 유지한다(0 = 같은 값일 때만 유지)
GNB2_TREND_DEADBAND_MBPS=10
# level 모드(GNB2_DECISION_MODE=level): 12p_c 를 아래 경계로 단계에 넣고 단계별 gNB2 몫으로 총합을 나눈다.
#  - 14_e: NR gNB2 set = 총합×몫, WLAN set 둘 = 나머지(gbr=mbr), gNB1 set 은 그대로. 단계만 바뀌어도 PCF 로 보낸다
#  - 15f: 단계 0 이면 DEEP_SLEEP(gNB2 0), 그 위는 ACTIVE — 상태가 바뀔 때만 RICF 로 보낸다
#  - TH · HYST · DEADBAND 는 level 모드에서 쓰지 않는다(trend 로 되돌릴 때 그대로 쓴다)
#  - 두두원 UPF 는 gNB2 set 과 노트북2 WLAN set 의 mbr 비만 10% 단위(11단계)로 올려 쓴다 → 몫은 10 의 배수로.
#    10 은 UPF 설정(atsss_support_10_pro)에 따라 0% 가 될 수 있고, 100 은 WLAN set 이 0 이 된다(경고만)
# 경계(Mbps, 오름차순). 첫 값 미만이 단계 0. 기본 172,305,338 = 10/17~10/19 실측 틱 값(≈151 · 327 · 347, 최고 ≈370)의 빈 구간
GNB2_LEVEL_BOUNDS_MBPS=172,305,338
# 단계별 gNB2 몫(%) — 개수는 경계+1, 첫 값 0, 나머지는 10 의 배수(비감소). 기본 = 0:100 / 50:50(최고 370 의 절반 185) / 70:30 / 90:10
GNB2_LEVEL_GNB2_PCT=0,50,70,90
# gNB2 set + WLAN set gbr/mbr 합(Mbps) — 총합×몫/100 이 정수여야 한다
GNB2_SPLIT_TOTAL_MBPS=1000

# --- 하위 구독 주기 ---
# WLAN_PERFORMANCE(12p_c, 판정 입력) 하위 구독 repPeriod(초). 두두원은 이 값을 송신 주기이자 평균 창(최근 N초)으로 쓴다.
# 비우면 상향 repPeriod 를 따른다. 다른 하위 구독은 항상 상향 repPeriod 를 따른다.
# 하위 구독을 만들 때만 읽는다 — 바꾸면 NCOF 재기동(복원 시 재구독)해야 반영된다. 상향 repPeriod 이하로 둘 것(끊김 판정 = 상향×3)
WLAN_SUB_REP_PERIOD_SEC=10
