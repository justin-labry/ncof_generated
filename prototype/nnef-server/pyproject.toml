[project]
name = "nnef-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorlog>=6.10.1",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "uvicorn>=0.46.0",
    "callback-server",
    "nncof-server",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nnef"] # 실제 소스코드가 위치한 경로

# nnef 는 nncof_cb(callback-server) 와 nncof(nncof-server) 패키지를 import 한다.
# 선언하지 않으면 멤버 디렉터리에서 `uv sync` 했을 때 해당 패키지가 venv 에서
# 제거되어 ModuleNotFoundError 가 난다.
[tool.uv.sources]
callback-server = { workspace = true }
nncof-server = { workspace = true }
